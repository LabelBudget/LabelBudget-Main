[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelbudget"
version = "0.0.1"
description = "자기지도 사전학습 이득이 라벨 몇 개까지 유효한지 측정하는 연구 코드"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2026.09",
    "lightgbm>=4.7",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 비교군 C·D (스펙 04). 2026-10-22 설치 확인 버전으로 고정
gnn = ["torch==2.14.1", "torch-geometric==2.8.1"]
# chemprop 등가성 비교 전용. RDKit을 2026.03으로 내리므로 별도 환경(environment-equiv.yml)에만 설치
equiv = ["chemprop==2.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
